<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>504 - Gateway Timeout</title>
    <style>:root{--bg-color:#0b0f19;--card-bg:rgba(255,255,255,0.03);--card-border:rgba(255,255,255,0.07);--text-primary:#ffffff;--text-secondary:#94a3b8}*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background-color:var(--bg-color);color:var(--text-primary);min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative;padding:24px}.bg-grid{position:absolute;width:200%;height:200%;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:30px 30px;transform:rotate(-15deg);top:-50%;left:-50%;z-index:1;animation:gridMove 25s linear infinite}@keyframes gridMove{0%{transform:rotate(-15deg) translateY(0)}100%{transform:rotate(-15deg) translateY(30px)}}.glow-orb{position:absolute;width:350px;height:350px;background:radial-gradient(circle,rgba(59,130,246,0.12) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%, -50%);z-index:2;pointer-events:none;filter:blur(30px)}.error-card{background:var(--card-bg);border:1px solid var(--card-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:40px 30px;max-width:480px;width:100%;text-align:center;position:relative;z-index:10;box-shadow:0 15px 35px rgba(0,0,0,0.4);animation:fadeInUp .6s cubic-bezier(0.16,1,0.3,1)}@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.error-code-wrapper{position:relative;display:inline-block;margin-bottom:8px}.error-code{font-size:5.5rem;font-weight:800;line-height:1;background:linear-gradient(135deg,#ffffff 40%,#475569);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px;position:relative}.error-code::after{content:attr(data-error);position:absolute;left:1px;top:1px;text-shadow:-1px 0 #ef4444,0 1px #3b82f6;background:var(--bg-color);-webkit-background-clip:initial;-webkit-text-fill-color:initial;color:transparent;opacity:0.2;animation:glitch 2.5s infinite linear alternate-reverse}@keyframes glitch{0%{clip-path:inset(30% 0 50% 0)}20%{clip-path:inset(80% 0 5% 0)}40%{clip-path:inset(10% 0 75% 0)}60%{clip-path:inset(70% 0 10% 0)}80%{clip-path:inset(5% 0 85% 0)}100%{clip-path:inset(50% 0 20% 0)}}h2{font-size:1.6rem;font-weight:600;margin-bottom:12px;letter-spacing:-0.3px}p{font-size:0.95rem;color:var(--text-secondary);line-height:1.5;margin-bottom:28px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 28px;border-radius:30px;font-weight:600;font-size:0.95rem;text-decoration:none;background:#ffffff;color:#0b0f19;box-shadow:0 4px 12px rgba(255,255,255,0.08);transition:all .25s ease;cursor:pointer;width:100%;max-width:220px}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(255,255,255,0.15);background:#f1f5f9}@media (max-width:480px){.error-card{padding:30px 20px}.error-code{font-size:4.5rem}h2{font-size:1.4rem}p{font-size:0.9rem}}</style>
</head>
<body>
    <div class="bg-grid"></div><div class="glow-orb"></div>
    <div class="error-card">
        <div class="error-code-wrapper"><div class="error-code" data-error="504">504</div></div>
        <h2>Upstream Timeout</h2>
        <p>The main distribution gateway server did not receive a timely validation pulse from the backend cluster node.</p>
        <a href="#" id="dynamic-home-btn" class="btn">Go to Home Page</a>
    </div>
    <script>document.getElementById('dynamic-home-btn').href = window.location.origin;</script>
</body>
</html>
